<ion-content [fullscreen]="true" class="signup-page">

  <div class="signup-container">

    <!-- Header -->
    <div class="header-section">

      <div class="back-button" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </div>

      <div class="header-text">
        <h1>Create Account</h1>
        <p>Start organizing your day with TodoMate.</p>
      </div>

    </div>

    <!-- Sign Up Form -->
    <div class="form-section">

      <!-- First Name / Last Name -->
      <div class="name-row">

        <div class="input-group">
          <ion-icon name="person-outline"></ion-icon>

          <ion-input
            type="text"
            placeholder="First Name"
            [(ngModel)]="firstName"
            name="firstName"
            fill="clear">
          </ion-input>
        </div>

        <div class="input-group">
          <ion-input
            type="text"
            placeholder="Last Name"
            [(ngModel)]="lastName"
            name="lastName"
            fill="clear">
          </ion-input>
        </div>

      </div>

      <!-- Email -->
      <div class="input-group">
        <ion-icon name="mail-outline"></ion-icon>

        <ion-input
          type="email"
          placeholder="Email Address"
          [(ngModel)]="email"
          name="email"
          fill="clear">
        </ion-input>
      </div>

      <!-- Mobile Number -->
      <div class="input-group">
        <ion-icon name="call-outline"></ion-icon>

        <ion-input
          type="tel"
          placeholder="Mobile Number"
          [(ngModel)]="phone"
          name="phone"
          fill="clear">
        </ion-input>
      </div>

      <!-- Password -->
      <div class="input-group">
        <ion-icon name="lock-closed-outline"></ion-icon>

        <ion-input
          #passwordInput
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password"
          [(ngModel)]="password"
          name="password"
          fill="clear">
        </ion-input>

        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword"
          (mousedown)="$event.preventDefault()"
          (click)="togglePasswordVisibility(passwordInput.value)">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <ion-icon name="lock-closed-outline"></ion-icon>

        <ion-input
          #confirmPasswordInput
          [type]="showConfirmPassword ? 'text' : 'password'"
          placeholder="Confirm Password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          fill="clear">
        </ion-input>

        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'"
          [attr.aria-pressed]="showConfirmPassword"
          (mousedown)="$event.preventDefault()"
          (click)="toggleConfirmPasswordVisibility(confirmPasswordInput.value)">
          <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <!-- Terms -->
      <div class="terms-section">

        <ion-checkbox [(ngModel)]="acceptedTerms" name="acceptedTerms"></ion-checkbox>

        <p>
          I agree to the
          <a href="#">Terms & Conditions</a>
          and
          <a href="#">Privacy Policy</a>.
        </p>

      </div>

      <!-- Sign Up Button -->
      <ion-button
        expand="block"
        class="signup-button"
        [disabled]="busy"
        (click)="register()">
        Create Account
      </ion-button>

      <!-- Login -->
      <div class="login-link">
        <span>Already have an account?</span>
        <a (click)="goToLogin()">Log In</a>
      </div>

    </div>

  </div>

</ion-content>
