<ion-content [fullscreen]="true" class="login-page">

  <div class="login-container">

    <!-- Logo -->
    <div class="logo-section">
      <div class="logo-icon">
        <div class="logo-check">✓</div>
      </div>

      <h1>
        Todo<span>Mate</span>
      </h1>

      <p>Plan today. Achieve tomorrow.</p>
    </div>

    <!-- Login Form -->
    <div class="form-section">

      <!-- Email -->
      <div class="input-group">
        <ion-icon name="mail-outline"></ion-icon>

        <ion-input
          type="email"
          placeholder="Email or Phone Number"
          [(ngModel)]="email"
          name="email"
          fill="clear">
        </ion-input>
      </div>

      <!-- Password -->
      <div class="input-group">
        <ion-icon name="lock-closed-outline"></ion-icon>

        <ion-input
          #passwordInput
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password"
          [(ngModel)]="password"
          name="password"
          fill="clear">
        </ion-input>

        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword"
          (mousedown)="$event.preventDefault()"
          (click)="togglePasswordVisibility(passwordInput.value)">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <!-- Login Button -->
      <ion-button
        expand="block"
        class="login-button"
        [disabled]="busy"
        (click)="login()">
        Log In
      </ion-button>

      <!-- Forgot Password -->
      <div class="forgot-password">
        <a (click)="forgotPassword()">Forgot Password?</a>
      </div>

      <!-- Divider -->
      <div class="divider">
        <span></span>
        <p>or</p>
        <span></span>
      </div>

      <!-- Register -->
      <ion-button
        expand="block"
        fill="outline"
        class="register-button"
        (click)="goToSignup()">
        Create an Account
      </ion-button>

    </div>

  </div>

</ion-content>
